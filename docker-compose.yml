services:
  # ============================================================================
  # 1. API Gateway / Reverse Proxy
  # ============================================================================
  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/nginx/Dockerfile
    container_name: marketlens-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    depends_on:
      frontend:
        condition: service_started
      market-service:
        condition: service_healthy
      news-service:
        condition: service_healthy
      pipeline-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - marketlens-network

  # ============================================================================
  # 2. Frontend Application (React 18 + Vite Dev Server with Hot Reload)
  # ============================================================================
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.dev
    container_name: marketlens-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=/api/v1
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - marketlens-network

  # ============================================================================
  # 3. User & Auth Service (Java + Spring Boot)
  # ============================================================================
  user-auth-service:
    build:
      context: backend/user-auth-service
      dockerfile: Dockerfile
    container_name: marketlens-auth
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-marketlens}
      - DB_USER=${POSTGRES_USER:-marketlens_admin}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-marketlens_secret}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - marketlens-network

  # ============================================================================
  # 4. Market Data Service (Member 1: Python)
  # ============================================================================
  market-service:
    build:
      context: backend/market-data-service
      dockerfile: Dockerfile
    container_name: marketlens-market-service
    restart: unless-stopped
    environment:
      - PORT=8001
      - DB_HOST=postgres
      - DB_PORT=5432
    volumes:
      - ./backend/market-data-service/app:/app/app
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - marketlens-network

  # ============================================================================
  # 5. Financial News & Intelligence Service (Member 3: Python)
  # ============================================================================
  news-service:
    build:
      context: backend/news-service
      dockerfile: Dockerfile
    container_name: marketlens-news-service
    restart: unless-stopped
    environment:
      - PORT=8002
      - NEWS_API_KEY=${NEWS_API_KEY:-demo_key}
    volumes:
      - ./backend/news-service/app:/app/app
    ports:
      - "8002:8002"
    networks:
      - marketlens-network

  # ============================================================================
  # 6. Data Ingestion & Data Pipeline Service (Member 4: Python)
  # ============================================================================
  pipeline-service:
    build:
      context: data-pipeline
      dockerfile: Dockerfile
    container_name: marketlens-pipeline-service
    restart: unless-stopped
    environment:
      - PORT=8003
      - DB_HOST=postgres
      - DB_PORT=5432
      - TWELVE_DATA_API_KEY=${TWELVE_DATA_API_KEY:-demo_key}
      - CSE_API_KEY=${CSE_API_KEY:-demo_key}
    volumes:
      - ./data-pipeline/app:/app/app
      - uploaded_datasets:/app/uploads
      - processed_data:/app/processed
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - marketlens-network

  # ============================================================================
  # 7. AI Prediction & Advanced Analytics Service (Member 5: Python)
  # ============================================================================
  ai-service:
    build:
      context: ai
      dockerfile: Dockerfile
    container_name: marketlens-ai-service
    restart: unless-stopped
    environment:
      - PORT=8004
      - PIPELINE_SERVICE_URL=http://pipeline-service:8003
      - MARKET_SERVICE_URL=http://market-service:8001
    volumes:
      - ./ai/app:/app/app
      - model_weights:/app/models
    ports:
      - "8004:8004"
    depends_on:
      pipeline-service:
        condition: service_healthy
    networks:
      - marketlens-network

  # ============================================================================
  # 8. PostgreSQL & TimescaleDB Database
  # ============================================================================
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: marketlens-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketlens}
      POSTGRES_USER: ${POSTGRES_USER:-marketlens_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketlens_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketlens_admin} -d ${POSTGRES_DB:-marketlens}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketlens-network

networks:
  marketlens-network:
    name: marketlens-network
    driver: bridge

volumes:
  postgres_data:
    name: marketlens_postgres_data
  uploaded_datasets:
    name: marketlens_uploaded_datasets
  processed_data:
    name: marketlens_processed_data
  model_weights:
    name: marketlens_model_weights
