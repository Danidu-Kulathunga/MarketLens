name: Release & Deployment Pipeline

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  validate-and-tag:
    name: Build & Package Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Node for Frontend Production Build
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Build Optimized Frontend Bundle
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Log Target Deployment Trigger
        run: |
          echo "Packaging MarketLens release for environment: ${{ github.event.inputs.target_env || 'release-tag' }}"
          echo "Release Tag / Commit SHA: ${{ github.sha }}"
