name: Backend Services CI Pipeline

on:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - 'data-pipeline/**'
      - 'ai/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - 'data-pipeline/**'
      - 'ai/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  test-python-services:
    name: Python Microservices Lint & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        service:
          - backend/market-data-service
          - backend/news-service
          - data-pipeline
          - ai

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '${{ matrix.service }}/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.service }}/requirements.txt
          pip install pytest flake8

      - name: Lint with Flake8
        run: |
          # Stop build if syntax errors or undefined names exist
          flake8 ${{ matrix.service }} --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 ${{ matrix.service }} --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run Pytest
        run: |
          cd ${{ matrix.service }}
          pytest -v

  test-java-auth-service:
    name: Java Auth Service Build & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: |
          cd backend/user-auth-service
          mvn clean test-compile
