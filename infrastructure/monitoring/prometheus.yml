global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:80']

  - job_name: 'user-auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['user-auth-service:8080']

  - job_name: 'market-data-service'
    static_configs:
      - targets: ['market-service:8001']

  - job_name: 'news-service'
    static_configs:
      - targets: ['news-service:8002']

  - job_name: 'pipeline-service'
    static_configs:
      - targets: ['pipeline-service:8003']

  - job_name: 'ai-service'
    static_configs:
      - targets: ['ai-service:8004']
