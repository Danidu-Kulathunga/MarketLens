events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # Rate limiting zone (100 req/sec burst 50)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    upstream frontend_upstream {
        server frontend:5173;
    }

    upstream auth_upstream {
        server user-auth-service:8080;
    }

    upstream market_upstream {
        server market-service:8001;
    }

    upstream news_upstream {
        server news-service:8002;
    }

    upstream pipeline_upstream {
        server pipeline-service:8003;
    }

    upstream ai_upstream {
        server ai-service:8004;
    }

    server {
        listen 80;
        server_name localhost;

        # Healthcheck endpoint for Gateway itself
        location /health {
            return 200 '{"status":"healthy","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        # User & Auth Service
        location /api/v1/auth/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://auth_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Market Data Service (Member 1)
        location /api/v1/market/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://market_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # News & Intelligence Service (Member 3)
        location /api/v1/news/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://news_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Data Pipeline & Ingestion Service (Member 4)
        location /api/v1/pipeline/ {
            client_max_body_size 50M; # Support CSV/JSON dataset uploads
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://pipeline_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # AI Prediction Service (Member 5)
        location /api/v1/ai/ {
            proxy_read_timeout 60s; # Longer timeout for model inference
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://ai_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Frontend Application (Vite Dev / Nginx)
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
